[build-system]
requires = ["setuptools>=80.3.1", "wheel", "setuptools_scm[toml]>=8.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ACLGen-backend"
description = "REST API for the ACLGen web application"
authors = [{name="Sikt - Norwegian Agency for Shared Services in Education and Research", email="kontakt@sikt.no"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "django>=5.2,<6.1",
    "djangorestframework>=3.17,<3.18",
    "django-cors-headers",
    "drf-yasg",
]
dynamic = ["version"]

[project.urls]
"GitHub" = "https://github.com/Uninett/aclgen-backend"

[dependency-groups]
test = [
    "coverage",
    "pytest>7",
    "pytest-cov",
    "pytest-django",
    "tox",
]
maintenance = [
    "build",
    "twine",
]
dev = [
    "ruff",
    "pre-commit",
    "ipython",
    {include-group = "maintenance"},
    {include-group = "test"},
]

[tool.setuptools]
include-package-data = true
zip-safe = false
platforms = ["any"]

[tool.setuptools.packages.find]
where = ["app"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = [
    "*.rst",
]

[tool.setuptools.exclude-package-data]
"*" = ["tests/"]

[tool.setuptools_scm]
write_to = "app/api/version.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["BLE001", "E4", "E7", "E9", "F", "I"]
fixable = ["I"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't need coverage for ellipsis used for type annotations
    "\\.\\.\\.",
    # Don't complain about lines excluded unless type checking
    "if TYPE_CHECKING:",
    # We don't need tests to cover unimplementedness
    "raise NotImplementedError",
]

[tool.coverage.run]
source = ["app"]
omit = ["**/api/version.py"]
patch = ["subprocess"]
